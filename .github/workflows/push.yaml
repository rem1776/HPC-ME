name: Build and Push CI Images
on: push

jobs:
  build-ci-images:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Files
      uses: actions/checkout@v5.0.0
    - name: Login to Github Container Registry
      uses: docker/login-action@v1
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
    - name: Build base image
      uses: docker/build-push-action@v6.18.0
      with:
        context: ci/
        push: false
        file: "ci/Dockerfile-base"
    - name: Build fms image
      uses: docker/build-push-action@v6.18.0
      with:
        context: ci/
        push: true
        file: "ci/Dockerfile-fms"
        tag: ghcr.io/rem1776/fms/fms-ci-gnu:latest
    - name: Build fre-nctools image
      uses: docker/build-push-action@v6.18.0
      with:
        context: ci/
        push: false
        file: "ci/Dockerfile-frenct"
        tag: ghcr.io/rem1776/fre-nctools/frenct-ci-gnu:latest
    - name: Build fre-cli image
      uses: docker/build-push-action@v6.18.0
      with:
        context: ci/
        push: false
        file: "ci/Dockerfile-frecli"
        tag: ghcr.io/rem1776/frecli-ci-gnu:latest
